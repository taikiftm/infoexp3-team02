<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz Board</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Quiz Board</h1>
      <nav class="mode-nav">
        <button type="button" id="btnShowPlay" class="nav-btn active">クイズを遊ぶ</button>
        <button type="button" id="btnShowAdmin" class="nav-btn">クイズ管理（運営）</button>
      </nav>
    </header>

    <!-- 訪問者プレイ画面（担当B） -->
    <main id="play-view" class="view-section">
      <!-- スタート画面 -->
      <section id="start-view" class="card">
        <h2>クイズに挑戦！</h2>
        <p class="muted">プレイヤー名を入力して開始してください。</p>
        <div class="form-group">
          <input id="player-name" type="text" maxlength="30" placeholder="プレイヤー名">
        </div>
        <button id="start-button" type="button" class="btn btn-primary btn-block">
          クイズ開始
        </button>
      </section>

      <!-- クイズ出題画面 -->
      <section id="quiz-view" class="card" hidden>
        <p id="question-number" class="badge">問題 1 / 5</p>
        <h2 id="question-text">ここに問題文を表示</h2>
        <div id="choices" class="choices-list">
          <!-- 選択肢をJavaScriptで追加 -->
        </div>
        <p id="answer-feedback" class="status-msg"></p>
      </section>

      <!-- 結果・ランキング画面 -->
      <section id="result-view" class="card" hidden>
        <h2>クイズ結果</h2>
        <p id="final-score">あなたの得点：0 / 5点</p>
        <p id="average-score" class="muted">全体平均：- 点</p>
        <hr>
        <h3>ランキング</h3>
        <div id="ranking">
          <!-- ランキングをJavaScriptで追加 -->
        </div>
      </section>
    </main>

    <!-- 運営者管理画面（担当C） -->
    <main id="admin-view" class="view-section hidden">
      <section class="card">
        <h2>新しいクイズを投稿</h2>
        <form id="quizForm">
          <div class="form-group">
            <label for="questionInput">問題文</label>
            <textarea id="questionInput" rows="3" placeholder="例：HTTPでリソースの新規作成成功を表すステータスコードは？" required></textarea>
          </div>

          <div class="form-group">
            <label>選択肢（正解のラジオボタンを選択）</label>
            <div id="choicesContainer" class="choices-list"></div>
            <button type="button" id="addChoiceBtn" class="btn btn-secondary">＋ 選択肢を追加</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block">クイズを投稿する</button>
          <p id="adminMessage" class="status-msg"></p>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>登録済みクイズ一覧</h2>
          <span id="quizCount" class="badge">0問</span>
        </div>
        <div id="quizList" class="quiz-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/admin.js"></script>
  <script src="/static/play.js"></script>
</body>

</html>
